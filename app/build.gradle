plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services' apply false
}

if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace 'dev.focuswall'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.focuswall'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    def releaseStore = System.getenv('FOCUS_WALL_KEYSTORE')
    def releasePassword = System.getenv('FOCUS_WALL_KEYSTORE_PASSWORD')
    if (releaseStore != null && releasePassword != null) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias 'focus-wall'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore != null && releasePassword != null) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

