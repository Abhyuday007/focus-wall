plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.focuswall'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'dev.focuswall'
        minSdk 29
        targetSdk 36
        versionCode 6
        versionName '1.4.0'
    }

    def releaseStore = System.getenv('FOCUS_WALL_KEYSTORE')
    def releasePassword = System.getenv('FOCUS_WALL_KEYSTORE_PASSWORD')
    if (releaseStore != null && releasePassword != null) {
        signingConfigs {
            release {
                storeFile file(releaseStore)
                storePassword releasePassword
                keyAlias 'focus-wall'
                keyPassword releasePassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStore != null && releasePassword != null) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

